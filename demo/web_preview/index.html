async function loadCountry(value){const token=++request;code=value;path=[];$('search').value='';loading=true;failed=false;render();const local=value==='CN'||cached.has(value);await new Promise(r=>setTimeout(r,local?60:550));if(token!==request)return;loading=false;failed=!local&&$('offline').checked;if(!failed&&value!=='CN')cached.add(value);render()}
function selectNode(n){path=[n[0]];let cursor=n;while(cursor[1]!=='cc:'+code){cursor=find(cursor[1]);path.unshift(cursor[0])}$('search').value='';render();$('crumb-'+n[0])?.focus()}
function countryList(){const host=$('countries');host.replaceChildren();const title=document.createElement('div');title.className='section-label';title.textContent=tr('countries');host.append(title);for(const c of countries){const b=button('',()=>loadCountry(c[0]),'country'+(c[0]===code?' active':''),{'id':'country-'+c[0],'data-code':c[0],'aria-pressed':String(c[0]===code),'aria-label':cname(c)+', '+tr(c[0]==='CN'?'offline':cached.has(c[0])?'cached':'online')});const mark=c[0]==='CN'?'◉':cached.has(c[0])?'✓':'↓';const cc=document.createElement('span');cc.className='country-code';cc.textContent=c[0];const content=document.createElement('span');content.className='country-text';const name=document.createElement('div');name.className='country-name';name.textContent=cname(c);const native=document.createElement('div');native.className='country-native';native.textContent=c[1];content.append(name,native);const marker=document.createElement('span');marker.className='marker';marker.textContent=mark;b.append(cc,content,marker);host.append(b)}}

function renderRegions(){const host=$('regions');host.replaceChildren();if(loading){host.append(state('loading','loading'));return}if(failed){host.append(state('cloud','error',button(tr('retry'),()=>loadCountry(code),'secondary',{'data-action':'retry','id':'retry'})));return}const q=$('search').value.trim().toLowerCase();const parent=path.at(-1)||'cc:'+code;const visible=nodes.filter(n=>n[0].startsWith(code.toLowerCase()+':')&&(q?[n[0],n[2],...Object.values(n[3])].join(' ').toLowerCase().includes(q):n[1]===parent));if(!visible.length){const hint=document.createElement('small');hint.textContent=q?tr('emptyHint'):'';host.append(state(q?'search':'done',q?'empty':'deepest',hint));return}for(const n of visible){const b=button('',()=>selectNode(n),'region',{'data-id':n[0],'id':'region-'+n[0]});const pin=document.createElement('span');pin.className='region-icon';fill(pin,icon('pin'));const body=document.createElement('span');body.className='region-body';const name=document.createElement('div');name.className='region-name';name.textContent=nname(n);const id=document.createElement('div');id.className='region-id';id.textContent=n[0];body.append(name,id);const arrow=document.createElement('span');arrow.className='region-arrow';fill(arrow,icon('chevron'));b.append(pin,body,arrow);host.append(b)}}

$('logo').innerHTML=icon('globe');$('theme').innerHTML=icon('moon');$('search-icon').innerHTML=icon('search');$('path-icon').innerHTML=icon('route');$('locale').onchange=e=>{locale=e.target.value;render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').setAttribute('aria-pressed',String(document.body.classList.contains('dark')))};$('search').oninput=()=>{renderRegions();$('clear').classList.toggle('hidden',!$('search').value)};$('clear').onclick=()=>{$('search').value='';render();$('search').focus()};$('offline').onchange=()=>{};$('fail').onclick=()=>{request++;loading=false;failed=true;render()};$('back').onclick=()=>{path.pop();$('search').value='';render()};$('confirm').onclick=()=>{if(!canConfirm())return;saved={datasetId:'geo-regions-ui-fixture',countryCode:code,pathIds:ids(),dataRevision:'fixture-1'};render();$('proof-heading').focus();$('toast').textContent=tr('selected');$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2200)};$('discard').onclick=()=>{$('app').inert=true;$('dialog').classList.remove('hidden');$('keep').focus()};function closeDialog(){$('app').inert=false;$('dialog').classList.add('hidden');$('discard').focus()}$('keep').onclick=closeDialog;$('discard-confirm').onclick=()=>{request++;code=saved?.countryCode||'CN';path=saved?saved.pathIds.slice(1):[];loading=false;failed=false;$('search').value='';$('app').inert=false;$('dialog').classList.add('hidden');render();($('confirm').disabled?$('proof-heading'):$('confirm')).focus()};$('dialog').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Tab'){const first=$('keep'),last=$('discard-confirm');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
