name: geo_regions_demo
publish_to: none
description: >-
  Interactive demo running the production geo_regions SDK over generated
  offline assets; not the SDK itself and not a published package.
version: 0.2.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Kept for demo/flutter/integration_test (coordinator-owned). The widget
  # chrome itself uses the SDK's own material library (see lib/main.dart).
  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0
  # The demo embeds the SDK from this repository; demo packages are not
  # published, so a path dependency is the intended integration shape.
  geo_regions:
    path: ../..
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  # Vendor variant of the assets CLI fragments (demo/flutter/tools/*.config.json):
  # the CLI emits packages/geo_regions/data/... entries for in-package data;
  # the demo vendors both bundles locally and rewrites the prefix per file.
  # Regenerate before building:
  #   dart run geo_regions:assets --config config/assets.hybrid-cn.json \
  #     --out demo/flutter/assets/geo_regions/ --replace
  #   dart run geo_regions:assets --config demo/flutter/tools/geo_cdn.config.json \
  #     --out demo/flutter/assets/geo_cdn/ --replace
  assets:
    - "assets/geo_regions/catalog_i18n/ar.json"
    - "assets/geo_regions/catalog_i18n/de.json"
    - "assets/geo_regions/catalog_i18n/en.json"
    - "assets/geo_regions/catalog_i18n/fr.json"
    - "assets/geo_regions/catalog_i18n/it.json"
    - "assets/geo_regions/catalog_i18n/ja.json"
    - "assets/geo_regions/catalog_i18n/ko.json"
    - "assets/geo_regions/catalog_i18n/ru.json"
    - "assets/geo_regions/catalog_i18n/zh-Hans.json"
    - "assets/geo_regions/catalog_i18n/zh-Hant.json"
    - "assets/geo_regions/countries.json"
    - "assets/geo_regions/i18n/ar/CN.json"
    - "assets/geo_regions/i18n/de/CN.json"
    - "assets/geo_regions/i18n/en/CN.json"
    - "assets/geo_regions/i18n/fr/CN.json"
    - "assets/geo_regions/i18n/it/CN.json"
    - "assets/geo_regions/i18n/ja/CN.json"
    - "assets/geo_regions/i18n/ko/CN.json"
    - "assets/geo_regions/i18n/ru/CN.json"
