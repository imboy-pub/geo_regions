name: Draft data release

on:
  push:
    tags: ['data-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag: data-vYYYY.MM.DD or data-vYYYY.MM.DD.N'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"data-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(?:\.[0-9]+)?", os.environ["RELEASE_TAG"]), "invalid data tag"'
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      force_flutter: true
    permissions:
      contents: read

  draft:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify tag and assemble data artifact
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 -m pip install -r tool/requirements-ci.txt
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          python3 tool/package_release.py --tag "$RELEASE_TAG" --out dist --source-commit "$VERIFIED_COMMIT"
      - name: Create draft without overwriting any release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 tool/verify_release_tag.py --tag "$RELEASE_TAG" --commit "$VERIFIED_COMMIT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this immutable tag; refusing to replace it.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --draft --title "geo_regions research seed $RELEASE_TAG" --notes-file docs/RELEASE_NOTES_TEMPLATE.md
